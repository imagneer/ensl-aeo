<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>엔슬 — 브랜드 프로필 입력</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  :root {
    --surface-0: #FAF9F6; --surface-1: #F1EFE8; --surface-2: #FFFFFF;
    --text-primary: #1A1A18; --text-secondary: #5F5E5A; --text-muted: #8A8880;
    --border: #E6E4DC; --border-strong: #D3D1C7;
    --bg-success: #EAF3DE; --text-success: #27500A;
    --bg-warning: #FBF0DC; --text-warning: #7A4B08;
    --brand: #00A4B8; --bg-brand: #DAEEF1; --text-brand: #007685;
    --radius: 8px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-0); color: var(--text-primary); line-height: 1.5; }
  input, select, textarea { font-family: inherit; }

  .shell { display: flex; min-height: 100vh; }

  /* 왼쪽: 입력 폼 */
  .form-panel { width: 480px; flex-shrink: 0; background: var(--surface-2); padding: 88px 56px 40px; display: flex; flex-direction: column; overflow-y: auto; }
  .top-row { position: fixed; top: 32px; left: 56px; right: calc(100% - 480px + 56px); display: flex; align-items: center; justify-content: space-between; background: var(--surface-2); z-index: 2; }
  .logo-mark { width: 26px; height: 26px; border-radius: 8px; background: var(--text-primary); }
  .logout-btn { font-size: 13px; color: var(--text-secondary); background: transparent; border: 0.5px solid var(--border-strong); border-radius: var(--radius); padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

  .step-eyebrow { font-size: 12px; color: var(--text-muted); margin: 0 0 6px; }
  .step-eyebrow b { color: var(--text-primary); }
  .step-dots { display: flex; gap: 5px; margin-bottom: 18px; }
  .step-dots span { width: 22px; height: 3px; border-radius: 2px; background: var(--border-strong); }
  .step-dots span.done { background: var(--text-primary); }
  h1 { font-size: 28px; font-weight: 500; line-height: 1.35; margin: 0 0 10px; letter-spacing: -0.01em; }
  .step-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin: 0 0 16px; }
  .ai-note { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-brand); background: var(--bg-brand); border-radius: 20px; padding: 5px 12px; width: fit-content; margin-bottom: 28px; }
  .manual-note { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); background: var(--surface-1); border-radius: 20px; padding: 5px 12px; width: fit-content; margin-bottom: 28px; }
  .ai-note i { font-size: 13px; }

  .field { margin-bottom: 24px; }
  .field label { display: block; font-size: 12.5px; font-weight: 500; color: var(--text-primary); margin-bottom: 2px; }
  .field .hint { display: block; font-size: 11.5px; color: var(--text-muted); margin-bottom: 8px; }
  .region-warn { display: none; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-warning); margin: 8px 0 0; }
  .region-warn.show { display: flex; }
  .region-warn i { font-size: 12px; }
  .field textarea {
    width: 100%; font-size: 13.5px; padding: 11px 12px; border: 0.5px solid var(--border-strong);
    border-radius: var(--radius); background: var(--surface-2); color: var(--text-primary);
    line-height: 1.6; resize: none; min-height: 76px;
  }
  .field input {
    width: 100%; font-size: 14px; padding: 10px 12px; border: 0.5px solid var(--border-strong);
    border-radius: var(--radius); background: var(--surface-2); color: var(--text-primary);
  }
  .field textarea:focus, .field input:focus { outline: none; border-color: var(--text-primary); }

  .tag-box { display: flex; flex-wrap: wrap; gap: 7px; padding: 10px; border: 0.5px solid var(--border-strong); border-radius: var(--radius); }
  .tag-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; background: var(--surface-1); border-radius: 20px; padding: 5px 6px 5px 12px; }
  .tag-chip button { border: none; background: none; color: var(--text-muted); cursor: pointer; font-size: 13px; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }
  .tag-add { font-size: 12.5px; color: var(--text-muted); background: none; border: 0.5px dashed var(--border-strong); border-radius: 20px; padding: 5px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }

  .spacer { flex: 1; }
  .next-row { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 16px; }
  .back-link { font-size: 13px; color: var(--text-muted); background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 5px; }
  .next-btn { font-size: 13.5px; font-weight: 500; padding: 11px 22px; background: var(--text-primary); color: var(--surface-2); border: none; border-radius: var(--radius); display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
  .next-btn:hover { background: #000; }

  /* 오른쪽: 발견 리빙 패널 */
  .preview-panel { flex: 1; background: var(--text-primary); padding: 48px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }

  .ripple { position: absolute; top: 50%; left: 50%; border: 0.5px solid rgba(0,164,184,0.35); border-radius: 50%; width: 40px; height: 40px; transform: translate(-50%,-50%) scale(1); opacity: 0; animation: ripple 6s ease-out infinite; pointer-events: none; }
  .ripple.r2 { animation-delay: 3s; }
  @keyframes ripple {
    0% { transform: translate(-50%,-50%) scale(1); opacity: 0.15; }
    60% { opacity: 0.06; }
    100% { transform: translate(-50%,-50%) scale(20); opacity: 0; }
  }

  .preview-inner { width: 100%; max-width: 460px; position: relative; z-index: 1; }

  @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .pv-anim { opacity: 0; animation: fadeInUp 0.6s ease-out forwards; }

  .pv-eyebrow { font-size: 13px; color: rgba(255,255,255,0.45); margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }
  .pv-eyebrow i { font-size: 14px; color: var(--brand); }
  .pv-livedot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); display: inline-block; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,164,184,0.5); } 50% { opacity: 0.6; box-shadow: 0 0 0 4px rgba(0,164,184,0); } }
  .pv-brand { font-size: 30px; font-weight: 500; color: #fff; line-height: 1.3; margin: 0 0 4px; }
  .pv-domain { font-size: 12.5px; color: rgba(255,255,255,0.4); margin: 0 0 24px; }
  .pv-quote { font-size: 15px; color: rgba(255,255,255,0.75); line-height: 1.7; margin: 0 0 28px; padding-left: 14px; border-left: 2px solid rgba(255,255,255,0.2); }
  .pv-section { margin-bottom: 22px; }
  .pv-section .k { font-size: 11px; color: rgba(255,255,255,0.4); margin: 0 0 8px; }
  .pv-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .pv-chip { font-size: 12.5px; color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.08); border-radius: 20px; padding: 6px 13px; opacity: 0; animation: fadeInUp 0.4s ease-out forwards; }
  .pv-inline { font-size: 13.5px; color: rgba(255,255,255,0.8); margin: 0; }
  .pv-placeholder { color: rgba(255,255,255,0.3) !important; font-style: italic; }

  /* 항목 추가 모달 */
  .add-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,26,24,0.45); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
  .add-modal-overlay.open { display: flex; }
  .add-modal-box { background: var(--surface-2); border-radius: 12px; width: 100%; max-width: 360px; padding: 24px; }
  .add-modal-title { font-size: 15px; font-weight: 500; margin: 0 0 14px; }
  .add-modal-input { width: 100%; font-size: 14px; padding: 11px 13px; border: 0.5px solid var(--border-strong); border-radius: var(--radius); margin-bottom: 16px; }
  .add-modal-input:focus { outline: none; border-color: var(--text-primary); }
  .add-modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .add-modal-cancel { font-size: 13px; color: var(--text-secondary); background: none; border: 0.5px solid var(--border-strong); border-radius: var(--radius); padding: 9px 16px; cursor: pointer; }
  .add-modal-cancel:hover { background: var(--surface-1); }
  .add-modal-confirm { font-size: 13px; font-weight: 500; color: var(--surface-2); background: var(--text-primary); border: none; border-radius: var(--radius); padding: 9px 16px; cursor: pointer; }
  .add-modal-confirm:hover { background: #000; }
</style>
</head>
<body>

<div class="shell">

  <!-- 왼쪽: 입력 폼 -->
  <div class="form-panel">
    <div class="top-row">
      <div class="logo-mark"></div>
      <button class="logout-btn"><i class="ti ti-logout"></i>로그아웃</button>
    </div>

    <p class="step-eyebrow"><b>STEP 2</b> / 4</p>
    <div class="step-dots"><span class="done"></span><span class="done"></span><span></span><span></span></div>
    <h1>브랜드 정보를<br>직접 알려주세요.</h1>
    <p class="step-desc">읽어볼 웹사이트가 없어서, 아래 정보를 하나씩 채워주세요.</p>
    <div class="manual-note"><i class="ti ti-edit"></i>직접 입력</div>

    <div class="field">
      <label>브랜드 이름</label>
      <input type="text" id="input-name" placeholder="예: 365서울원탑치과" oninput="var v=this.value.trim(); var el=document.getElementById('pv-brand'); el.textContent = v || '브랜드 이름'; el.classList.toggle('pv-placeholder', !v);" />
    </div>

    <div class="field">
      <label>브랜드 소개</label>
      <textarea id="input-desc" placeholder="어떤 브랜드인지 2~3문장으로 설명해주세요." oninput="var v=this.value.trim(); var el=document.getElementById('pv-quote'); el.textContent = v ? ('&quot;'+v+'&quot;') : '아직 입력하지 않았어요'; el.classList.toggle('pv-placeholder', !v);"></textarea>
    </div>

    <div class="field">
      <label>업종</label>
      <input type="text" id="input-industry" placeholder="예: 치과 / 임플란트" oninput="var v=this.value.trim(); var el=document.getElementById('pv-industry'); el.textContent = v || '아직 입력하지 않았어요'; el.classList.toggle('pv-placeholder', !v);" />
    </div>

    <div class="field">
      <label>브랜드가 내세우는 강점</label>
      <span class="hint">AI들도 이렇게 기억하는지는 진단에서 확인할게요.</span>
      <div class="tag-box" id="tagbox-strengths">
        <button class="tag-add" onclick="openAddModal('tagbox-strengths','pvchips-strengths','강점 추가')"><i class="ti ti-plus" style="font-size:11px;"></i>강점 추가</button>
      </div>
    </div>

    <div class="field">
      <label>제공 서비스</label>
      <div class="tag-box" id="tagbox-services">
        <button class="tag-add" onclick="openAddModal('tagbox-services','pvchips-services','서비스 추가')"><i class="ti ti-plus" style="font-size:11px;"></i>서비스 추가</button>
      </div>
    </div>

    <div class="field">
      <label>주요 활동 지역</label>
      <span class="hint">자리 질문의 지역 조건으로 반영돼요.</span>
      <input type="text" id="input-region" placeholder="예: 서울 강서구" oninput="handleRegionInput(this)" />
      <p class="region-warn" id="region-warn"><i class="ti ti-alert-triangle"></i>자리 질문에 그대로 쓰여요. 행정구역명이 아닌 단어가 섞여 있는 것 같아요.</p>
    </div>

    <div class="spacer"></div>
    <div class="next-row">
      <button class="back-link">웹사이트로 진단하기</button>
      <button class="next-btn">질문 확인하기 <i class="ti ti-arrow-right"></i></button>
    </div>
  </div>

  <!-- 오른쪽: 발견 리빙 패널 -->
  <div class="preview-panel">
    <div class="ripple"></div>
    <div class="ripple r2"></div>
    <div class="preview-inner">
      <p class="pv-eyebrow pv-anim" style="animation-delay:0s;"><span class="pv-livedot"></span>직접 입력 중</p>
      <p class="pv-brand pv-anim pv-placeholder" id="pv-brand" style="animation-delay:0.08s;">브랜드 이름</p>

      <p class="pv-quote pv-anim pv-placeholder" id="pv-quote" style="animation-delay:0.22s;">아직 입력하지 않았어요</p>

      <div class="pv-section pv-anim" style="animation-delay:0.30s;">
        <p class="k">업종</p>
        <p class="pv-inline pv-placeholder" id="pv-industry">아직 입력하지 않았어요</p>
      </div>

      <div class="pv-section pv-anim" style="animation-delay:0.38s;">
        <p class="k">브랜드가 내세우는 강점</p>
        <div class="pv-chips" id="pvchips-strengths"></div>
        <p class="pv-inline pv-placeholder" id="pvchips-strengths-empty">아직 추가하지 않았어요</p>
      </div>

      <div class="pv-section pv-anim" style="animation-delay:0.46s;">
        <p class="k">제공 서비스</p>
        <div class="pv-chips" id="pvchips-services"></div>
        <p class="pv-inline pv-placeholder" id="pvchips-services-empty">아직 추가하지 않았어요</p>
      </div>

      <div class="pv-section pv-anim" style="margin-bottom:0; animation-delay:0.54s;">
        <p class="k">주요 활동 지역</p>
        <p class="pv-inline pv-placeholder" id="pv-region">아직 입력하지 않았어요</p>
      </div>
    </div>
  </div>

</div>

<!-- 항목 추가 모달 -->
<div id="add-modal" class="add-modal-overlay" onclick="if(event.target===this) closeAddModal();">
  <div class="add-modal-box">
    <p class="add-modal-title" id="add-modal-title">항목 추가</p>
    <input type="text" id="add-modal-input" class="add-modal-input" placeholder="예: 야간 진료" />
    <div class="add-modal-actions">
      <button class="add-modal-cancel" onclick="closeAddModal()">취소</button>
      <button class="add-modal-confirm" onclick="confirmAddModal()">추가</button>
    </div>
  </div>
</div>

<script>
var addModalContext = null;
var seq = 0;

var SIDO_NAMES = ['서울', '부산', '대구', '인천', '광주', '대전', '울산', '세종', '경기', '강원', '충북', '충남', '전북', '전남', '경북', '경남', '제주'];
var ADMIN_SUFFIXES = ['시', '도', '군', '구', '읍', '면', '동'];

function looksLikeAdminName(token) {
  if (SIDO_NAMES.indexOf(token) !== -1) return true;
  if (token.length < 2) return false;
  var lastChar = token.charAt(token.length - 1);
  return ADMIN_SUFFIXES.indexOf(lastChar) !== -1;
}

function handleRegionInput(input) {
  var value = input.value.trim();
  var regionEl = document.getElementById('pv-region');
  regionEl.textContent = value || '아직 입력하지 않았어요';
  regionEl.classList.toggle('pv-placeholder', !value);
  var warnEl = document.getElementById('region-warn');

  if (value.length === 0) { warnEl.classList.remove('show'); return; }

  var tokens = value.split(/\s+/);
  var hasInvalidToken = tokens.some(function (t) { return !looksLikeAdminName(t); });
  warnEl.classList.toggle('show', hasInvalidToken);
}

function removeTagPair(id) {
  document.querySelectorAll('[data-id="' + id + '"]').forEach(function (el) { el.remove(); });
  updateEmptyStates();
}

function updateEmptyStates() {
  ['strengths', 'services'].forEach(function (key) {
    var box = document.getElementById('pvchips-' + key);
    var emptyEl = document.getElementById('pvchips-' + key + '-empty');
    if (box && emptyEl) emptyEl.style.display = box.children.length === 0 ? 'block' : 'none';
  });
}

function openAddModal(leftBoxId, rightBoxId, title) {
  addModalContext = { leftBoxId: leftBoxId, rightBoxId: rightBoxId };
  document.getElementById('add-modal-title').textContent = title;
  var input = document.getElementById('add-modal-input');
  input.value = '';
  document.getElementById('add-modal').classList.add('open');
  setTimeout(function () { input.focus(); }, 50);
}
function closeAddModal() {
  document.getElementById('add-modal').classList.remove('open');
}
function confirmAddModal() {
  if (!document.getElementById('add-modal').classList.contains('open')) return; // 이미 처리됨(중복 방지)
  var input = document.getElementById('add-modal-input');
  var value = input.value.trim();
  if (!value || !addModalContext) { closeAddModal(); return; }

  var id = 'new' + (seq++);

  var leftBox = document.getElementById(addModalContext.leftBoxId);
  var chip = document.createElement('span');
  chip.className = 'tag-chip';
  chip.dataset.id = id;
  chip.textContent = value;
  var del = document.createElement('button');
  del.textContent = '×';
  del.setAttribute('onclick', "removeTagPair('" + id + "')");
  chip.appendChild(del);
  leftBox.insertBefore(chip, leftBox.querySelector('.tag-add'));

  var rightBox = document.getElementById(addModalContext.rightBoxId);
  var pvChip = document.createElement('span');
  pvChip.className = 'pv-chip';
  pvChip.dataset.id = id;
  pvChip.textContent = value;
  rightBox.appendChild(pvChip);

  updateEmptyStates();
  closeAddModal();
}
document.getElementById('add-modal-input').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') {
    if (e.isComposing || e.keyCode === 229) return; // 한글 등 IME 조합 확정 Enter는 무시
    e.preventDefault();
    confirmAddModal();
  }
  if (e.key === 'Escape') closeAddModal();
});
</script>

</body>
</html>
